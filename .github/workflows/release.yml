name: Publish signed release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: velocity-stable-release
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and select real release version
        env:
          REQUESTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          version=$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')
          if [[ "$REQUESTED_REF" == refs/tags/* ]] && [ "$REQUESTED_REF" != "refs/tags/v$version" ]; then
            echo 'The version tag must match version.properties'; exit 1
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - name: Analyze, format-check and test
        run: |
          chmod +x gradlew
          ./gradlew checkKotlinFormat :app:dependencies :app:lintDebug :app:testDebugUnitTest --console=plain
          node --test scripts/generate-update.test.mjs
      - name: Load private release keys
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MANIFEST_KEY_BASE64: ${{ secrets.MANIFEST_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$MANIFEST_KEY_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/velocity.p12"
          printf '%s' "$MANIFEST_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/manifest-key.pem"
      - name: Build and verify signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/velocity.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease :app:lintRelease --console=plain --no-configuration-cache
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/certificate.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt")
          expected=$(tr -d '\r\n' < config/android-signing-sha256.txt)
          test "${actual,,}" = "${expected,,}"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify recording recovery and exercise the actual signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ANDROID_SERIAL=emulator-5554 ./gradlew :app:connectedDebugAndroidTest --console=plain
            ANDROID_SERIAL=emulator-5554 node scripts/check-recording-recovery.mjs
            adb -s emulator-5554 uninstall com.example.myapplication
            ANDROID_SERIAL=emulator-5554 APK_PATH=app/build/outputs/apk/release/app-release.apk node scripts/smoke-release.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/recording-recovery/
            build/release-smoke/
          retention-days: 7
      - name: Authenticate previous release and generate new metadata
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          MANIFEST_KEY_PATH: ${{ runner.temp }}/manifest-key.pem
        run: |
          set -euo pipefail
          previous=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // empty')
          if [ -n "$previous" ]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$previous" --pattern update.json --pattern update.json.sig --dir "$RUNNER_TEMP/previous"
            export PREVIOUS_MANIFEST_PATH="$RUNNER_TEMP/previous/update.json"
          fi
          export AAPT2_PATH="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          export RELEASE_NOTES_PATH="release-notes/${RELEASE_TAG#v}.md"
          node scripts/generate-update.mjs
      - name: Upload all assets to draft, verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Velocity ${RELEASE_TAG#v}" --notes-file .release/release-notes.md
          gh release upload "$RELEASE_TAG" .release/velocity.apk .release/update.json .release/update.json.sig .release/release-notes.md
          mkdir -p "$RUNNER_TEMP/upload-check"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/upload-check"
          for file in velocity.apk update.json update.json.sig release-notes.md; do
            cmp ".release/$file" "$RUNNER_TEMP/upload-check/$file"
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Clean private key files
        if: always()
        run: rm -f "$RUNNER_TEMP/velocity.p12" "$RUNNER_TEMP/manifest-key.pem"
